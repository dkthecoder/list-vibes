<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Lists — harness</title>
		<link rel="stylesheet" href="../styles.css" />
		<style>
			/* A minimal stand-in for Obsidian's theme variables, so the harness
			   shows roughly what the plugin looks like inside the app. */
			:root {
				--background-primary: #ffffff;
				--background-secondary: #f5f6f8;
				--background-modifier-hover: rgba(0, 0, 0, 0.05);
				--background-modifier-active-hover: rgba(94, 87, 214, 0.12);
				--background-modifier-border: #e3e5e8;
				--text-normal: #1f2023;
				--text-muted: #6b6f76;
				--text-faint: #9aa0a6;
				--text-accent: #5e57d6;
				--text-error: #c0392b;
				--interactive-accent: #5e57d6;
				--font-ui-smaller: 12px;
				--font-ui-small: 13px;
				--font-ui-medium: 15px;
				--font-ui-large: 20px;
				--font-medium: 500;
				--font-semibold: 600;
				--font-bold: 700;
			}
			[data-theme="dark"] {
				--background-primary: #1e1e1e;
				--background-secondary: #262626;
				--background-modifier-hover: rgba(255, 255, 255, 0.06);
				--background-modifier-active-hover: rgba(138, 132, 255, 0.18);
				--background-modifier-border: #333;
				--text-normal: #dcddde;
				--text-muted: #999;
				--text-faint: #666;
				--text-accent: #8a84ff;
				--text-error: #e06c62;
				--interactive-accent: #8a84ff;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 24px;
				background: #eceef1;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				color: var(--text-normal);
			}
			[data-theme="dark"] body {
				background: #141414;
			}
			h2 {
				font-size: 13px;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: #6b6f76;
				margin: 0 0 10px;
			}
			.frame {
				background: var(--background-primary);
				border: 1px solid var(--background-modifier-border);
				border-radius: 10px;
				overflow: hidden;
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
			}
			#desktop,
			#desktop2 {
				height: 500px;
			}
			.phones {
				display: flex;
				gap: 20px;
				margin-top: 28px;
			}
			.phone {
				width: 320px;
				height: 600px;
				flex: 0 0 320px;
			}
			button {
				font-family: inherit;
				font-size: var(--font-ui-smaller);
				padding: 6px 12px;
				border: none;
				border-radius: 6px;
				background: var(--background-modifier-hover);
				color: var(--text-normal);
				cursor: pointer;
			}
			button.mod-cta {
				background: var(--interactive-accent);
				color: #fff;
			}
			.svg-icon {
				width: 18px;
				height: 18px;
			}
		</style>
	</head>
	<body>
		<h2>Desktop — detail sliding over the list</h2>
		<div class="frame" id="desktop"></div>

		<h2 style="margin-top: 28px">Desktop — 1–5 rating mode, sorted by importance, add box expanded</h2>
		<div class="frame" id="desktop2"></div>

		<div class="phones">
			<div>
				<h2>Mobile — lists</h2>
				<div class="frame phone" id="m-nav"></div>
			</div>
			<div>
				<h2>Mobile — tasks</h2>
				<div class="frame phone" id="m-tasks"></div>
			</div>
			<div>
				<h2>Mobile — detail overlay</h2>
				<div class="frame phone" id="m-detail"></div>
			</div>
		</div>

		<script src="./bundle.js"></script>
	</body>
</html>

name: Release

# Obsidian installs a plugin from the GitHub release whose tag exactly matches
# manifest.version — no "v" prefix. Pushing that tag is the whole release.
#
#   npm version patch    # bumps manifest.json + versions.json, commits, tags
#   git push && git push --tags
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # A broken build must never reach a release users can install.
      - name: Lint
        run: npx eslint src

      - name: Test
        run: npm test

      - name: Install Chromium for the UI suites
        run: npx playwright install --with-deps chromium

      - name: UI suites
        run: npm run test:ui

      - name: Build
        run: npm run build

      # The tag and manifest.version must agree, or Obsidian will not find the
      # download for the version it thinks it is installing.
      - name: Check tag matches manifest.version
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag $TAG does not match manifest.version $MANIFEST"
            exit 1
          fi
          echo "releasing $TAG"

      # Assets go up as individual files. Obsidian fetches them by name; a zip
      # is not read by the installer.
      # The changelog is written by hand and says what changed in words a user
      # cares about. Generated notes are a list of commit subjects, which is a
      # different and worse thing.
      - name: Notes for this version, from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          node -e "
            const fs = require('fs');
            const tag = process.argv[1];
            const md = fs.readFileSync('CHANGELOG.md', 'utf8');
            const from = md.indexOf('\n## ' + tag + '\n');
            if (from < 0) { console.error('::warning::no CHANGELOG entry for ' + tag); process.exit(0); }
            const rest = md.slice(from + 1);
            const next = rest.indexOf('\n## ');
            fs.writeFileSync('RELEASE_NOTES.md', (next < 0 ? rest : rest.slice(0, next)).trim() + '\n');
          " "$TAG"
          test -s RELEASE_NOTES.md || echo "release $TAG" > RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            main.js manifest.json styles.css

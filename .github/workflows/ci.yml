name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to a branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the name of the status check branch protection requires, so
  # it says what it is rather than "test".
  checks:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        # Errors fail; warnings are recorded debt. See eslint.config.mjs for
        # which rules are which and why.
        run: npx eslint src

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      # The browser suites drive the real panes: drags, renames, the mobile
      # layout, the keyboard, and the colour audit. They were the thing that
      # caught every layout bug this plugin has had, and until now they only
      # ever ran on one laptop.
      - name: Install Chromium for the UI suites
        run: npx playwright install --with-deps chromium

      - name: UI suites
        run: npm run test:ui

      # The plugin is only installable if these three exist and parse.
      - name: Verify release artefacts
        run: |
          set -e
          for f in main.js manifest.json styles.css; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          done
          node -e "
            const m = require('./manifest.json');
            const v = require('./versions.json');
            for (const k of ['id','name','version','minAppVersion','description','author']) {
              if (!m[k]) { console.error('::error::manifest.json missing ' + k); process.exit(1); }
            }
            if (!v[m.version]) {
              console.error('::error::versions.json has no entry for ' + m.version);
              process.exit(1);
            }
            if (v[m.version] !== m.minAppVersion) {
              console.error('::error::versions.json[' + m.version + '] does not match minAppVersion');
              process.exit(1);
            }
            console.log('manifest ok:', m.id, m.version, '(min', m.minAppVersion + ')');
          "

      # A release is a tag matching manifest.version. If the version in a merge
      # to main is one that already shipped, the tag can never be pushed and the
      # release silently never happens.
      - name: Version is not already released
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git fetch --tags --quiet
          V=$(node -p "require('./manifest.json').version")
          if git rev-parse "refs/tags/$V" >/dev/null 2>&1; then
            echo "::warning::$V is already tagged — bump before releasing (npm version patch|minor|major)"
          else
            echo "$V is unreleased and ready to tag"
          fi
